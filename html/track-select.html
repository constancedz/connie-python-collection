<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Track</title>
</head>
<body>
<!-- Practice dropdown only: no enrolment service is connected. Place inside a form for submission validation. -->
<label for="track-select">Choose Track</label>
<select id="track-select" name="track" required>
  <option value="" disabled selected>Select a track</option>
  <optgroup label="Foundations">
    <option value="scratch">Scratch &amp; Junior Scratch</option>
    <option value="robotics">Robotics &amp; IoT</option>
  </optgroup>
  <optgroup label="Programming">
    <option value="web">HTML, CSS &amp; Web</option>
    <option value="python">Python Programming</option>
  </optgroup>
</select>
</body>
</html>
