<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student ID Form</title>
</head>
<body>
<!-- Practice form only: checks format, not whether an ID exists. No verification service is connected. Do not enter real student IDs. -->
<form>
  <label for="cs-code">Connie sons Student ID (e.g., CS-2026):</label>
  <input 
    type="text" 
    id="cs-code" 
    name="cs_code" 
    pattern="CS-[0-9]{4}" 
    title="Format must be CS- followed by 4 digits (e.g., CS-2026)" 
    required
  >
  <button type="submit">Verify Student ID</button>
</form>
</body>
</html>
