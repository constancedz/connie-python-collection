<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Code Input</title>
</head>
<body>
<!-- Practice input only: checks the pattern, not whether an ID exists. No verification service is connected. Do not enter real student IDs. Place inside a form for submission validation. -->
<label for="student-code">Student ID (e.g., CS-2026)</label>
<input
  type="text"
  id="student-code"
  name="student_code"
  pattern="CS-[0-9]{4}"
  title="Enter CS- followed by 4 digits, such as CS-2026"
  required
>
</body>
</html>
