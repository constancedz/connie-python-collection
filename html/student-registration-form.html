<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration Form</title>
</head>
<body>
<!-- Practice form only: no registration service is connected. Do not submit real personal information. -->
<form action="/register" method="POST">
  <label for="student-name">Student Full Name:</label>
  <input type="text" id="student-name" name="student_name" required minlength="2">

  <label for="student-age">Age (5 - 99):</label>
  <input type="number" id="student-age" name="student_age" min="5" max="99" required>

  <label for="parent-email">Parent/Guardian Email:</label>
  <input type="email" id="parent-email" name="parent_email" required>

  <button type="submit">Enroll at Connie sons</button>
</form>
</body>
</html>
