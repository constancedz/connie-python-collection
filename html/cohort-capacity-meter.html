<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cohort Capacity Meter Example</title>
</head>
<body>
<p>Practice example only: these numbers do not show live cohort availability.</p>
<label for="cohort-meter">Cohort Capacity (22 / 30 seats)</label>
<meter id="cohort-meter" min="0" max="30" low="10" high="25" optimum="18" value="22">
  22 out of 30
</meter>
</body>
</html>
