<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cisco Cohort Status Example</title>
</head>
<body>
<p>Practice example only: these numbers do not show live enrolment or confirmed cohort capacity.</p>
<section aria-labelledby="cisco-seats">
  <h2 id="cisco-seats">Cisco Networking Academy — Cohort Status</h2>
  <label for="seat-meter">Enrolled Learners (24 of 30 Seats Taken):</label>
  <meter id="seat-meter" min="0" max="30" low="10" high="25" optimum="20" value="24">
    24 out of 30
  </meter>
</section>
</body>
</html>
