<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connie sons Program Selector</title>
</head>
<body>
<!-- Practice dropdown only: not connected to an enrolment service. -->
<label for="course-select">Select a Connie sons Program:</label>
<select id="course-select" name="course" required>
  <option value="" disabled selected>-- Choose a Course --</option>
  <optgroup label="Beginner &amp; Youth">
    <option value="jr-scratch">Junior Scratch</option>
    <option value="robotics">Hands-On Robotics</option>
  </optgroup>
  <optgroup label="Intermediate &amp; Career">
    <option value="python">Python Programming</option>
    <option value="web-dev">HTML, CSS &amp; Web Development</option>
    <option value="iot">Internet of Things (IoT)</option>
  </optgroup>
</select>
</body>
</html>
