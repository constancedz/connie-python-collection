<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA Mobile Number Input Example</title>
</head>
<body>
<p>Practice example only: this checks the number format, not whether a number exists. No service is connected. Do not enter real phone numbers.</p>
<label for="sa-mobile">SA Mobile Number</label>
<input
  type="tel"
  id="sa-mobile"
  name="sa_mobile"
  pattern="0[0-9]{9}"
  placeholder="0XXXXXXXXX"
  title="10 digits starting with 0"
  required
>
</body>
</html>
