<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learner Application Form Example</title>
</head>
<body>
<p>Practice form only. The age range is an example, not confirmed eligibility criteria. The form blocks submission when JavaScript is enabled; no application service is connected. Do not enter real personal information.</p>
<form action="/apply" method="post" onsubmit="return false">
  <label for="learner-name">Full Name</label>
  <input type="text" id="learner-name" name="learner_name" required minlength="2">

  <label for="learner-age">Age (8–35)</label>
  <input type="number" id="learner-age" name="learner_age" min="8" max="35" required>

  <label for="learner-email">Email Address</label>
  <input type="email" id="learner-email" name="learner_email" required>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
