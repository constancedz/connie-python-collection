<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Upload Input Example</title>
</head>
<body>
<p>Practice example only: this file picker is not connected to an upload service. Do not select files containing private information.</p>
<label for="code-upload">Upload Project (.py, .html, .zip)</label>
<input type="file" id="code-upload" name="code_upload" accept=".py,.html,.zip" required>
</body>
</html>
